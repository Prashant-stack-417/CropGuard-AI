name: Vercel Parallel Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-prod-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  RELEASE_SHA: ${{ github.sha }}

jobs:
  deploy-frontend:
    name: Deploy frontend
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate Vercel secrets
        run: |
          if [ -z "${{ env.VERCEL_TOKEN }}" ]; then
            echo "Missing VERCEL_TOKEN secret" >&2
            exit 1
          fi
          if [ -z "${{ env.VERCEL_ORG_ID }}" ]; then
            echo "Missing VERCEL_ORG_ID secret" >&2
            exit 1
          fi
          if [ -z "${{ env.VERCEL_PROJECT_ID }}" ]; then
            echo "Missing VERCEL_FRONTEND_PROJECT_ID secret" >&2
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        working-directory: Frontend
        run: vercel pull --yes --environment=production --token=${{ env.VERCEL_TOKEN }}

      - name: Build frontend
        working-directory: Frontend
        run: |
          vercel build --prod --build-env VITE_APP_RELEASE=${{ env.RELEASE_SHA }} --build-env VITE_API_URL=https://cropguard-backend.vercel.app --token=${{ env.VERCEL_TOKEN }}

      - name: Deploy frontend
        id: deploy
        working-directory: Frontend
        run: |
          url=$(vercel deploy --prebuilt --prod --meta release=${{ env.RELEASE_SHA }} --token=${{ env.VERCEL_TOKEN }})
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"